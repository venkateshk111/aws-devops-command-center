<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DevOps Command Center</title>
<meta name="description" content="300+ searchable AWS CLI, Terraform, Docker, Kubernetes, Git, Ansible, Helm and Linux commands. Search in plain English. One-click copy. Free, no login required.">
<meta name="keywords" content="AWS CLI, Terraform, Docker, Kubernetes, DevOps, command reference, cheatsheet, cloud commands, AWS cheatsheet">
<meta name="author" content="aws-devops-command-center">
<meta property="og:title" content="AWS DevOps Command Center">
<meta property="og:description" content="300+ searchable cloud & DevOps commands. Type in plain English, copy in one click.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #07090d;
  --sidebar:   #0b0e15;
  --surface:   #0f1420;
  --card:      #131928;
  --border:    #1c2535;
  --border2:   #253040;
  --text:      #e2eaf6;
  --muted:     #4e6480;
  --faint:     #28384f;
  --tool:      #ff9900;
  --tool-dim:  rgba(255,153,0,0.10);
  --tool-dim2: rgba(255,153,0,0.05);
  --green:     #22c55e;
  --mono:      'JetBrains Mono', monospace;
  --ui:        'Outfit', sans-serif;
  --code-text: #9ec8f0;
  --code-bg:   rgba(0,0,0,0.35);
  --code-bd:   #28384f;
  --topbar-bg: rgba(7,9,13,0.96);
}

body.light {
  --bg:        #f0f4f8;
  --sidebar:   #e4ecf4;
  --surface:   #ffffff;
  --card:      #ffffff;
  --border:    #c8d8e8;
  --border2:   #b0c8dc;
  --text:      #0d1b2a;
  --muted:     #4a6a88;
  --faint:     #9ab4c8;
  --tool-dim:  rgba(255,153,0,0.12);
  --tool-dim2: rgba(255,153,0,0.06);
  --green:     #16a34a;
  --code-text: #0d5c8a;
  --code-bg:   #eaf4fc;
  --code-bd:   #b8d8f0;
  --topbar-bg: rgba(240,244,248,0.96);
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── TOPBAR ─────────────────────────────────────────── */
.topbar {
  height: 52px;
  background: var(--topbar-bg);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px 0 0;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}

.topbar-brand {
  width: 220px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  border-right: 1px solid var(--border);
  height: 100%;
}

.brand-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, #1a2540, #253050);
  border: 1px solid var(--border2);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.brand-text { display: flex; flex-direction: column; gap: 1px; }
.brand-name { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; line-height: 1; }
.brand-sub  { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }

.search-wrap {
  flex: 1;
  max-width: 500px;
  position: relative;
}
.search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
#search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--ui);
  padding: 8px 12px 8px 36px;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
}
#search:focus { border-color: var(--tool); box-shadow: 0 0 0 3px var(--tool-dim); }
#search::placeholder { color: var(--muted); }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.total-badge {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 4px 10px;
  white-space: nowrap;
}
.total-badge span { color: var(--tool); }

/* ── LAYOUT ─────────────────────────────────────────── */
.layout { display: flex; flex: 1; }

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
  padding: 12px 0 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--faint);
  text-transform: uppercase;
  padding: 6px 14px 8px;
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border: none;
  background: none;
  cursor: pointer;
  width: 100%;
  text-align: left;
  font-family: var(--ui);
  border-left: 2px solid transparent;
  transition: all 0.14s;
  position: relative;
}

.tool-btn:hover { background: rgba(255,255,255,0.025); }

.tool-btn.active {
  background: var(--tool-dim);
  border-left-color: var(--tool);
}

.tool-icon {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  font-weight: 800;
  font-family: var(--mono);
  transition: all 0.14s;
  border: 1px solid var(--border2);
}

.tool-info { flex: 1; min-width: 0; }
.tool-name { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.2; transition: color 0.14s; white-space: nowrap; }
.tool-btn.active .tool-name { color: var(--text); }
.tool-btn:hover .tool-name  { color: var(--text); }
.tool-sub  { font-size: 10px; color: var(--faint); line-height: 1; margin-top: 2px; }

.tool-count {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--faint);
  color: var(--bg);
  flex-shrink: 0;
  transition: all 0.14s;
}
.tool-btn.active .tool-count { background: var(--tool); color: #000; }

.sidebar-div { height: 1px; background: var(--border); margin: 8px 14px; }

/* ── MAIN ─────────────────────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* Tool header */
.tool-header {
  padding: 20px 28px 0;
  display: flex;
  align-items: center;
  gap: 14px;
}

.tool-header-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900;
  font-family: var(--mono);
  flex-shrink: 0;
  border: 1px solid var(--border2);
}

.tool-header-info { flex: 1; }
.tool-header-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.tool-header-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }

.tool-header-stat {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--muted);
}

/* Category filter pills */
.cat-bar {
  padding: 14px 28px 0;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.cat-btn {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 100px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  font-family: var(--ui);
  padding: 5px 13px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.cat-btn:hover { border-color: var(--tool); color: var(--text); }
.cat-btn.active { background: var(--tool); border-color: var(--tool); color: #000; font-weight: 700; }

/* Command list */
.cmd-list {
  padding: 18px 28px 60px;
  flex: 1;
}

/* Note box */
.note-box {
  background: var(--tool-dim2);
  border: 1px solid var(--tool-dim);
  border-radius: 10px;
  padding: 11px 15px;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 20px;
  line-height: 1.65;
  display: flex;
  gap: 9px;
  align-items: flex-start;
}
.note-box .ni { color: var(--tool); flex-shrink:0; margin-top:1px; font-size:13px; }
.note-box strong { color: var(--text); }
.note-box code { font-family:var(--mono); font-size:11.5px; color:var(--tool); background:var(--tool-dim); padding:1px 5px; border-radius:3px; }

/* Section */
.section { margin-bottom: 36px; }

.section-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after { content:''; flex:1; height:1px; background:var(--border); }
.section-title .sc { color: var(--tool); font-family: var(--mono); font-size: 10px; }

/* 3-column card grid */
.cmd-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

/* Command card */
.cmd-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.14s, box-shadow 0.14s;
  animation: fadeIn 0.2s ease both;
  display: flex;
  flex-direction: column;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.cmd-card:hover {
  border-color: var(--border2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

/* Code block — copy button lives inside here */
.cmd-code-wrap {
  position: relative;
  background: var(--code-bg);
  border-bottom: 1px solid var(--border);
  padding: 10px 58px 10px 12px; /* right padding reserves space for "Copy" btn */
}

.cmd-code {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--code-text);
  word-break: break-all;
  line-height: 1.6;
  display: block;
  transition: color 0.14s;
}
.cmd-card:hover .cmd-code { color: var(--tool); }

/* Copy button — text label overlay inside code block */
.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--muted);
  height: 24px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.14s;
  flex-shrink: 0;
  font-size: 11px;
  font-family: var(--ui);
  font-weight: 600;
  letter-spacing: 0.03em;
  white-space: nowrap;
  opacity: 0;
}
.cmd-card:hover .copy-btn { opacity: 1; }
.copy-btn:hover { border-color: var(--tool); color: var(--tool); background: var(--tool-dim); }
.copy-btn.ok    { border-color: var(--green); color: var(--green); opacity: 1; background: rgba(34,197,94,0.08); }

/* Description area */
.cmd-body {
  padding: 10px 13px 12px;
  flex: 1;
}

.cmd-desc {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.6;
}

.cmd-desc { font-size: 13px; color: var(--muted); line-height: 1.65; }

/* Empty */
.empty { display:none; text-align:center; padding:70px 24px; }
.empty .ei { font-size:40px; opacity:0.25; margin-bottom:12px; }
.empty h3 { font-size:17px; font-weight:700; color:var(--text); margin-bottom:5px; }
.empty p  { font-size:13px; color:var(--muted); }

/* Search-all results */
.search-all-tool-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.sa-icon {
  width: 26px; height: 26px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; font-family: var(--mono);
  border: 1px solid var(--border2);
}
.sa-name { font-size: 14px; font-weight: 700; }
.sa-count { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: auto; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* Theme toggle */
.theme-btn {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--muted);
  font-size: 15px;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.theme-btn:hover { border-color: var(--tool); color: var(--tool); }

@media (max-width: 1200px) {
  .cmd-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .sidebar { width: 180px; }
  .cmd-list { padding: 16px 16px 48px; }
  .cat-bar { padding: 12px 16px 0; }
  .tool-header { padding: 16px 16px 0; }
  .cmd-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .sidebar { display: none; }
  .topbar-brand { width: auto; }
  .cmd-grid { grid-template-columns: 1fr; }
  .copy-btn { opacity: 1; }
  .total-badge { display: none; }
  .layout { padding-bottom: 64px; } /* room for bottom nav */
}

/* ── HAMBURGER (mobile only) ─────────────────────────── */
.menu-btn {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  width: 34px; height: 34px;
  align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 16px;
  flex-shrink: 0;
  transition: border-color 0.15s;
}
.menu-btn:hover { border-color: var(--tool); }
@media (max-width: 640px) { .menu-btn { display: flex; } }

/* ── DRAWER OVERLAY ──────────────────────────────────── */
.drawer-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.25s;
}
.drawer-overlay.open { opacity: 1; }

.drawer {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 240px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
  padding: 16px 0 32px;
}
.drawer.open { transform: translateX(0); }

.drawer-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.drawer-title { font-size: 13px; font-weight: 700; color: var(--text); }
.drawer-close {
  margin-left: auto;
  background: none; border: none;
  color: var(--muted); font-size: 18px;
  cursor: pointer; line-height: 1;
  padding: 2px 4px;
}
.drawer-close:hover { color: var(--text); }

/* ── BOTTOM TAB BAR (mobile) ─────────────────────────── */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: var(--sidebar);
  border-top: 1px solid var(--border);
  z-index: 150;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.bottom-nav::-webkit-scrollbar { display: none; }

.bottom-nav-inner {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 4px;
  gap: 2px;
  min-width: max-content;
}

.bottom-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 12px;
  border: none;
  background: none;
  cursor: pointer;
  border-radius: 10px;
  transition: background 0.14s;
  min-width: 60px;
  font-family: var(--ui);
  position: relative;
}
.bottom-tab:hover { background: rgba(255,255,255,0.04); }
.bottom-tab.active { background: var(--tool-dim); }

.bottom-tab-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  font-family: var(--mono);
  border: 1px solid var(--border2);
  transition: border-color 0.14s;
}
.bottom-tab.active .bottom-tab-icon {
  border-color: var(--tool);
}

.bottom-tab-label {
  font-size: 9px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.02em;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
  max-width: 56px;
}
.bottom-tab.active .bottom-tab-label { color: var(--tool); }

/* Active indicator dot */
.bottom-tab.active::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--tool);
}

@media (max-width: 640px) { .bottom-nav { display: block; } }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-brand">
    <button class="menu-btn" onclick="openDrawer()" title="Switch tool">☰</button>
    <div class="brand-icon">⚡</div>
    <div class="brand-text">
      <div class="brand-name">AWS Command Center</div>
      <div class="brand-sub">AWS DevOps CLI Reference</div>
    </div>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search" placeholder="Search commands in plain English…" autocomplete="off" spellcheck="false"/>
  </div>
  <div class="topbar-right">
    <div class="total-badge"><span id="visibleCount">0</span> commands</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar"></nav>
  <!-- MAIN -->
  <div class="main" id="main"></div>
</div>

<!-- MOBILE DRAWER OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- MOBILE DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="brand-icon">⚡</div>
    <div class="drawer-title">Select Tool</div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawerNav"></div>
</div>

<!-- MOBILE BOTTOM TAB BAR -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script>
const TOOLS = [
  {
    id: 'aws',
    name: 'AWS CLI',
    short: 'AWS',
    color: '#FF9900',
    bg: '#1a1200',
    desc: 'Amazon Web Services',
    note: 'Install: <code>brew install awscli</code>. Configure with <code>aws configure</code>. Use <code>--profile</code> to switch accounts, <code>--region</code> to override region.',
    categories: [
      {
        name: 'Setup & Config',
        commands: [
          { cmd: 'aws configure', desc: 'Interactive setup — enter Access Key ID, Secret, default region, and output format. Always run first after install.' },
          { cmd: 'aws configure --profile myprofile', desc: 'Create a named profile for multiple AWS accounts. Append --profile to any command to use it.' },
          { cmd: 'aws configure list', desc: 'Show active credentials, region, and output format. Confirms which account you\'re pointed at.' },
          { cmd: 'aws sts get-caller-identity', desc: 'Confirm which IAM user or role is authenticated. Run before any destructive operation.' },
        ]
      },
      {
        name: 'S3',
        commands: [
          { cmd: 'aws s3 ls', desc: 'List all S3 buckets in the account.' },
          { cmd: 'aws s3 ls s3://my-bucket/', desc: 'List contents of a bucket or folder prefix.' },
          { cmd: 'aws s3 cp myfile.txt s3://my-bucket/', desc: 'Upload a local file to S3.' },
          { cmd: 'aws s3 cp s3://my-bucket/myfile.txt .', desc: 'Download a file from S3 to current directory.' },
          { cmd: 'aws s3 sync ./local-folder s3://my-bucket/', desc: 'Upload only new or changed files. Perfect for deploys and backups.' },
          { cmd: 'aws s3 rm s3://my-bucket/file.txt', desc: 'Delete a specific object from S3.' },
          { cmd: 'aws s3 rm s3://my-bucket/ --recursive', desc: 'Delete all objects under a prefix. Irreversible.' },
          { cmd: 'aws s3 presign s3://my-bucket/file.txt --expires-in 3600', desc: 'Generate a temporary pre-signed URL valid for 1 hour.' },
        ]
      },
      {

// Core match: split query into words, every word must hit something
function matchesQuery(cmd, desc, catName, toolName, extraTags) {
  const words = searchQuery.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return true;

  const haystack = [cmd, desc, catName, toolName, ...(extraTags||[])].join(' ').toLowerCase();

  return words.every(word => {
    // 1. Direct substring match across all text
    if (haystack.includes(word)) return true;
    // 2. Synonym expansion
    const syns = SYNONYMS[word] || [];
    return syns.some(syn => haystack.includes(syn));
  });
}

function setToolCSS(tool) {
  const r = document.documentElement.style;
  r.setProperty('--tool',     tool.color);
  r.setProperty('--tool-dim', hexToRgba(tool.color, 0.10));
  r.setProperty('--tool-dim2',hexToRgba(tool.color, 0.05));
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderMain() {
  if (searchAllMode && searchQuery) {
    renderSearchAll();
    return;
  }

  const tool = getTool();
  setToolCSS(tool);

  const allCats = ['All', ...tool.categories.map(c => c.name)];
  if (!allCats.includes(activeCat)) activeCat = 'All';

  // Filter
  const filtered = tool.categories
    .filter(c => activeCat === 'All' || c.name === activeCat)
    .map(c => ({
      ...c,
      commands: c.commands.filter(cmd =>
        !searchQuery || matchesQuery(cmd.cmd, cmd.desc, c.name, tool.name, cmd.tags)
      )
    }))
    .filter(c => c.commands.length > 0);

  const total = filtered.reduce((s,c) => s+c.commands.length, 0);
  document.getElementById('visibleCount').textContent = total;

  // Cat counts for pills
  const catCounts = {};
  tool.categories.forEach(c => {
    const count = c.commands.filter(cmd =>
      !searchQuery || matchesQuery(cmd.cmd, cmd.desc, c.name, tool.name, cmd.tags)

    catCounts[c.name] = count;

  const allCount = Object.values(catCounts).reduce((a,b)=>a+b,0);

  const emptyHTML = total === 0

    </div>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="tool-header">
      <div class="tool-header-icon" style="background:${tool.bg};color:${tool.color};border-color:${hexToRgba(tool.color,0.25)};font-size:${tool.short.length>2?'16px':'20px'}">${tool.short}</div>
      <div class="tool-header-info">
        <div class="tool-header-name" style="color:${tool.color}">${tool.name}</div>
        <div class="tool-header-desc">${tool.desc}</div>
      </div>
      <div class="tool-header-stat" style="border-color:${hexToRgba(tool.color,0.2)};color:${tool.color}">${total} cmd${total!==1?'s':''}</div>
    </div>
    ${pillsHTML}
    <div class="cmd-list">
      <div class="note-box">
        <span class="ni">💡</span>
        <div>${tool.note}</div>
      </div>
      ${emptyHTML}
      ${sectionsHTML}
    </div>`;
}

// ─────────────────────────────────────────────────────
function renderSearchAll() {
  let totalCount = 0;
  const results = TOOLS.map(tool => {
    const matchedCats = tool.categories.map(c => ({
      ...c,
      commands: c.commands.filter(cmd =>
        matchesQuery(cmd.cmd, cmd.desc, c.name, tool.name, cmd.tags)
      )
    })).filter(c => c.commands.length > 0);
    const count = matchedCats.reduce((s,c)=>s+c.commands.length,0);
    totalCount += count;
    return { tool, matchedCats, count };
  }).filter(r => r.count > 0);

  document.getElementById('visibleCount').textContent = totalCount;

  const pillsHTML = `<div class="cat-bar">
    <button class="cat-btn active">All Tools (${totalCount})</button>
  </div>`;

  const sectionsHTML = results.map(({ tool, matchedCats }) => `
    <div class="search-all-tool-header">
      <div class="sa-icon" style="background:${tool.bg};color:${tool.color};border-color:${hexToRgba(tool.color,0.25)}">${tool.short}</div>
      <div class="sa-name" style="color:${tool.color}">${tool.name}</div>
      <div class="sa-count" style="background:${hexToRgba(tool.color,0.12)};color:${tool.color}">${matchedCats.reduce((s,c)=>s+c.commands.length,0)}</div>
    </div>
    <div class="cmd-grid">
      ${matchedCats.map(cat => cat.commands.map((c,i) => `
        <div class="cmd-card" style="animation-delay:${i*10}ms;--tool:${tool.color};--tool-dim:${hexToRgba(tool.color,0.1)}">
          <div class="cmd-code-wrap">
            <code class="cmd-code">${escHtml(c.cmd)}</code>
            <button class="copy-btn" title="Copy" onclick="copyCmd('${escJs(c.cmd)}',this)">Copy</button>
          </div>
          <div class="cmd-body">
            <div class="cmd-desc">${c.desc}</div>
          </div>
        </div>`).join('')).join('')}
    </div>
  `).join('');

  const emptyHTML = totalCount === 0
    ? `<div class="cmd-list"><div class="empty" style="display:block"><div class="ei">🔍</div><h3>No commands found</h3><p>Try a broader search term</p></div></div>`
    : `<div class="cmd-list">${sectionsHTML}</div>`;

  document.getElementById('main').innerHTML = `
    <div class="tool-header">
      <div class="tool-header-icon" style="background:#1a2030;color:#aac8f0;font-size:18px">🔍</div>
      <div class="tool-header-info">
        <div class="tool-header-name" style="color:#aac8f0">Search results for "${escHtml(searchQuery)}"</div>
        <div class="tool-header-desc">Across all ${TOOLS.length} tools</div>
      </div>
      <div class="tool-header-stat">${totalCount} matches</div>
    </div>
    ${pillsHTML}
    ${emptyHTML}`;
}

// ─────────────────────────────────────────────────────
function selectTool(id) {
  activeTool  = id;
  activeCat   = 'All';
  searchAllMode = false;
  document.getElementById('search').value = '';
  searchQuery = '';
  renderSidebar();
  renderBottomNav();
  renderMain();
  document.querySelector('.main').scrollTop = 0;
  window.scrollTo(0, 0);
}

function setCat(cat) {
  activeCat = cat;
  renderMain();
}

function copyCmd(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
  });
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  if (searchQuery.length > 1) {
    searchAllMode = true;
    renderSidebar();
    renderBottomNav();
    renderSearchAll();
  } else {
    searchAllMode = false;
    renderSidebar();
    renderBottomNav();
    renderMain();
  }
});

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escJs(s)   { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// Init
renderSidebar();
renderBottomNav();
renderMain();
</script>
</body>
</html>
